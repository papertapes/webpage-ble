<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLE 系统化交互课程 · 从原理到 DA14531 实战</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef1f5; --text:#1d2633; --muted:#5b6779;
  --line:#dde3ea; --accent:#0b6bcb; --accent-bg:#e8f2fc; --ok:#188554; --ok-bg:#e5f5ee;
  --warn:#9a6700; --warn-bg:#fff3d6; --spec:#0b6bcb; --sim:#6929c4; --sim-bg:#f1e9fd;
  --danger:#c0392b; --danger-bg:#fdeceb; --code-bg:#eef1f5; --shadow:0 1px 3px rgba(16,24,40,.08);
}
[data-theme="dark"]{
  --bg:#11151b; --panel:#191f28; --panel2:#202836; --text:#e4e8ef; --muted:#9aa5b5;
  --line:#2b3542; --accent:#5aa7ff; --accent-bg:#17283c; --ok:#3ecf8e; --ok-bg:#12291f;
  --warn:#e3b341; --warn-bg:#2d2410; --spec:#5aa7ff; --sim:#b392f0; --sim-bg:#241a38;
  --danger:#ff7b72; --danger-bg:#331b19; --code-bg:#202836; --shadow:0 1px 3px rgba(0,0,0,.4);
}
/* ============ 基础 ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.75 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
h1,h2,h3,h4{line-height:1.35;margin:1.6em 0 .6em}
h1{font-size:1.7em;margin-top:.2em} h2{font-size:1.35em;border-bottom:1px solid var(--line);padding-bottom:.3em}
h3{font-size:1.12em} p{margin:.8em 0} strong{font-weight:600}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
code{background:var(--code-bg);border-radius:4px;padding:.1em .4em;font-size:.9em;
  font-family:Consolas,"Cascadia Mono",monospace;overflow-wrap:anywhere}
p,li,td,.co,.w-note,.qcard,th{overflow-wrap:anywhere}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto}
pre code{background:none;padding:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ============ 顶栏 ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.topbar .brand{font-weight:700;white-space:nowrap;color:var(--text)}
.topbar .brand small{color:var(--muted);font-weight:400}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;
  width:36px;height:36px;color:var(--text);font-size:18px}
.searchbox{position:relative;flex:1;max-width:440px;margin-left:auto}
.searchbox input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);padding:0 34px 0 12px}
.searchbox .icon{position:absolute;right:10px;top:7px;color:var(--muted);pointer-events:none}
.search-results{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:60}
.search-results .sr{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:9px 12px;color:var(--text)}
.search-results .sr:last-child{border-bottom:0}
.search-results .sr:hover{background:var(--panel2)}
.search-results .sr b{color:var(--accent)}
.search-results .sr .path{color:var(--muted);font-size:.85em;display:block}
.progress-chip{font-size:.85em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.progress-chip .bar{width:90px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress-chip .bar i{display:block;height:100%;background:var(--accent);width:0}
.theme-btn,.home-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  height:34px;padding:0 10px;color:var(--text)}
/* ============ 侧栏 ============ */
.sidebar{position:fixed;top:56px;bottom:0;left:0;width:270px;background:var(--panel);
  border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 40px;z-index:40}
.sidebar .filter{width:100%;height:32px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);padding:0 10px}
.stage-title{font-size:.8em;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:14px 8px 4px}
.unit-item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:7px 8px;color:var(--text);font-size:.92em}
.unit-item:hover{background:var(--panel2)}
.unit-item.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.unit-item .no{font-family:Consolas,monospace;color:var(--muted);font-size:.85em;min-width:20px}
.unit-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.unit-item.done .dot{background:var(--ok);border-color:var(--ok)}
.unit-item.wip{color:var(--muted)}
.unit-item.wip .badge{margin-left:auto;font-size:.7em;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
/* ============ 主区 ============ */
.main{margin-left:270px;padding:76px 26px 80px}
.content{max-width:900px;margin:0 auto}
.pager{display:flex;gap:10px;margin-top:44px}
.pager a{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}
.pager a small{display:block;color:var(--muted);font-size:.78em}
.pager a.next{text-align:right}
/* ============ 卡片/标注 ============ */
.co{border-left:4px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;
  padding:10px 14px;margin:14px 0;box-shadow:var(--shadow)}
.co-warn{border-left-color:var(--warn);background:var(--warn-bg)}
.co-spec{border-left-color:var(--spec);background:var(--accent-bg)}
.co-sim{border-left-color:var(--sim);background:var(--sim-bg)}
.co-unv{border-left-color:var(--muted);background:var(--panel);border-style:dashed}
.co .co-t{font-weight:700;font-size:.9em;letter-spacing:.03em;margin-bottom:2px}
.co-warn .co-t{color:var(--warn)} .co-spec .co-t{color:var(--spec)}
.co-sim .co-t{color:var(--sim)} .co-unv .co-t{color:var(--muted)}
.tag{display:inline-block;font-size:.72em;font-weight:600;border-radius:5px;padding:0 6px;margin-left:6px;
  border:1px solid var(--line);color:var(--muted);vertical-align:1px;white-space:nowrap}
table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:.93em}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2)}
.tbl caption{caption-side:top;text-align:left;color:var(--muted);font-size:.85em;padding-bottom:4px}
/* ============ 交互组件 ============ */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:18px 0;box-shadow:var(--shadow)}
.widget .w-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.widget .w-title{font-weight:700}
.widget .w-note{font-size:.85em;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0}
.ctrl label{font-size:.9em;color:var(--muted);display:flex;gap:6px;align-items:center}
.ctrl input[type=range]{width:200px}
.ctrl select,.ctrl input[type=number]{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:0 8px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:6px 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.stat{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}
.stat .cell{background:var(--panel2);border-radius:10px;padding:8px 14px;min-width:110px}
.stat .cell b{font-size:1.25em;display:block;font-family:Consolas,monospace}
.stat .cell span{font-size:.78em;color:var(--muted)}
.readout{font-family:Consolas,monospace}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85em;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 信道图 */
.chmap .ch{cursor:pointer}
.chmap text{font-size:9px;fill:var(--muted)}
/* 角色矩阵 */
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.rolecard{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px;text-align:left}
.rolecard b{display:block}
.rolecard small{color:var(--muted)}
.rolecard.sel{border-color:var(--accent);background:var(--accent-bg)}
/* 时间条 */
.timeline{display:flex;height:34px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.timeline .on{background:var(--accent)}
.timeline .off{background:var(--panel2);flex:1}
/* ============ 测验 ============ */
.quiz{margin-top:10px}
.qcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
.qcard .q{font-weight:600}
.qcard .opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.qcard label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.qcard label:hover{background:var(--panel2)}
.qcard label.correct{border-color:var(--ok);background:var(--ok-bg)}
.qcard label.wrong{border-color:var(--danger);background:var(--danger-bg)}
.qcard .exp{display:none;border-left:3px solid var(--accent);background:var(--accent-bg);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.93em;margin-top:8px}
.qcard .exp.show{display:block}
.quiz-result{font-weight:700;margin:6px 0}
/* ============ 单元头 ============ */
.unit-head .stage{color:var(--muted);font-size:.85em;letter-spacing:.05em}
.unit-head h1{margin:.2em 0 .3em}
.unit-head .tags{margin:6px 0 2px}
.markdone{margin-top:8px}
/* 总览卡片 */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.ov-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;box-shadow:var(--shadow)}
.ov-card b{display:block;margin-bottom:2px}
.ov-card small{color:var(--muted)}
.ov-card.locked{opacity:.55}
/* ============ 协议栈交互图 & 广播模拟器 ============ */
.stackviz .zone{font-size:.78em;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:10px 0 2px}
.stackviz .srow{display:flex;gap:8px;margin:5px 0}
.stackviz .srow button{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  padding:9px 6px;color:var(--text);font-size:.92em;text-align:center}
.stackviz .srow button:hover{border-color:var(--accent)}
.stackviz .srow button.hl{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.hcibar{border:1px dashed var(--accent);background:var(--accent-bg);border-radius:8px;text-align:center;
  padding:6px;margin:5px 0;font-size:.9em;color:var(--accent);font-weight:600;cursor:pointer}
.hcibar.hl{outline:2px solid var(--accent)}
.stackstep{border-left:3px solid var(--sim);background:var(--sim-bg);padding:8px 12px;
  border-radius:0 8px 8px 0;margin:8px 0;font-size:.92em}
.advlog{height:160px;overflow:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-family:Consolas,monospace;font-size:.85em;line-height:1.7}
.advlog div{white-space:nowrap}
.tl-svg .win{fill:var(--sim);opacity:.22;stroke:var(--sim);stroke-opacity:.6}
.tl-svg .puls{fill:var(--accent)}
.tl-svg .req{fill:var(--warn)}
.tl-svg .rsp{fill:var(--ok)}
.tl-svg text{font-size:10px;fill:var(--muted)}
.tl-svg .lane{stroke:var(--muted);stroke-width:1}
.tl-svg .laneT{font-size:11px;fill:var(--text);font-weight:600}
.tl-svg .c2p{stroke:var(--accent);stroke-width:2}
.tl-svg .c2p.lost{stroke:var(--danger)}
.tl-svg .p2c{stroke:var(--ok);stroke-width:2}
.tl-svg .skipc{stroke:var(--muted);fill:none;stroke-dasharray:3 3}
.tl-svg .toline{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:5 3}
.tl-svg .indline{stroke:var(--spec);stroke-width:2}
.pk-strip{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.pk-strip .b{padding:6px 3px;border-radius:4px;color:#10151c;text-align:center;min-width:28px;
  font-family:Consolas,monospace;font-size:.78em;cursor:default}
.pk-strip .b.ghost{opacity:.45}
.pk-hex{font-family:Consolas,monospace;font-size:.85em;background:var(--code-bg);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;word-break:break-all;margin:8px 0}
/* 概念对照卡 */
.acc{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0;box-shadow:var(--shadow)}
.acc-h{width:100%;text-align:left;background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;
  color:var(--text);display:flex;justify-content:space-between;gap:8px}
.acc-h:hover{color:var(--accent)}
.acc.open .acc-h{color:var(--accent)}
.acc-b{display:none;padding:0 14px 12px}
.acc.open .acc-b{display:block}
.acc-b table{width:100%;border-collapse:collapse;font-size:.93em;margin:6px 0}
.acc-b td{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
/* GATT 浏览器 */
.gatt-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.15fr);gap:14px}
@media (max-width:820px){.gatt-grid{grid-template-columns:1fr}}
.gatt-tree{width:100%;border-collapse:collapse;font-size:.88em}
.gatt-tree th,.gatt-tree td{border:1px solid var(--line);padding:5px 7px;text-align:left}
.gatt-tree .svc td{background:var(--panel2);font-weight:600}
.gatt-tree .chrow{cursor:pointer}
.gatt-tree .chrow:hover{background:var(--panel2)}
.gatt-tree .chrow.sel{background:var(--accent-bg)}
.gatt-tree .props span{display:inline-block;border:1px solid var(--line);border-radius:4px;
  font-size:.75em;padding:0 4px;margin:1px 2px 1px 0;color:var(--muted)}
.gatt-tree .props span.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.gatt-val{font-family:Consolas,monospace;font-size:.85em}
.mtu-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.mtu-bar div{height:100%}
/* ============ 响应式 ============ */
@media (max-width:920px){
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .sidebar{transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:72px 14px 60px}
  .progress-chip span.pct{display:none}
  .tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .widget{padding:12px}
  .ctrl input[type=range]{width:130px}
  pre{font-size:.82em}
}
@media (max-width:640px){
  .topbar{gap:6px;padding:0 8px}
  .brand small{display:none}
  .progress-chip{display:none}
  .home-btn{display:none}
  .searchbox{flex:1;min-width:80px;max-width:none}
  .searchbox input{padding-right:10px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="打开课程导航">☰</button>
  <div class="brand">BLE 交互课程 <small>· 原理 → 规范 → DA14531 实战</small></div>
  <div class="searchbox">
    <input id="searchInput" type="search" placeholder="全局搜索：术语、单元内容…" aria-label="全局搜索">
    <span class="icon">🔍</span>
    <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>
  </div>
  <div class="progress-chip" title="已掌握单元数">
    <span class="pct" id="progressText">0/20</span>
    <span class="bar"><i id="progressBar"></i></span>
  </div>
  <button class="home-btn" id="homeBtn" aria-label="回到课程总览">总览</button>
  <button class="theme-btn" id="themeBtn" aria-label="切换深浅主题">🌓</button>
</header>

<aside class="sidebar" id="sidebar" aria-label="课程导航">
  <input class="filter" id="unitFilter" type="search" placeholder="筛选单元…" aria-label="筛选单元">
  <div id="navList"></div>
</aside>

<main class="main"><div class="content" id="content" tabindex="-1"></div></main>

<script>
'use strict';
/* =====================================================================
 * BLE 系统化交互课程 —— 单文件应用
 * 结构：1 存储 / 2 主题 / 3 路由 / 4 侧栏 / 5 搜索 / 6 单元渲染
 *       7 测验引擎 / 8 单元数据（UNITS）/ 9 启动
 * ===================================================================== */

/* ---------- 1. 状态与存储 ---------- */
const LS_KEY = 'ble-course-state-v1';
const DEFAULT_STATE = { v:1, done:{}, quiz:{}, theme:'light', last:'#/overview', checklists:{} };
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const s = JSON.parse(raw);
    if(!s || s.v !== 1 || typeof s !== 'object') return structuredClone(DEFAULT_STATE);
    return Object.assign(structuredClone(DEFAULT_STATE), s);
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ /* 存储不可用时静默降级 */ } }

/* ---------- 2. 主题 ---------- */
function applyTheme(){
  document.documentElement.dataset.theme = state.theme === 'dark' ? 'dark' : 'light';
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveState();
}

/* ---------- 3. 生命周期：切页清理 ---------- */
let cleanups = [];
function addCleanup(fn){ cleanups.push(fn); }
function teardown(){
  cleanups.forEach(fn => { try{ fn(); }catch(e){} });
  cleanups = [];
}

/* ---------- 4. 课程常量 ---------- */
const STAGES = [
  { no:1, name:'第一阶段 · BLE 基础',        ids:['01','02','03'] },
  { no:2, name:'第二阶段 · 协议栈和链路层',  ids:['04','05','06','07'] },
  { no:3, name:'第三阶段 · GATT 数据模型与应用开发', ids:['08','09','10','11'] },
  { no:4, name:'第四阶段 · 安全、演进与性能', ids:['12','13','14'] },
  { no:5, name:'第五阶段 · Renesas DA14531 实战', ids:['15','16','17','18','19'] },
  { no:6, name:'第六阶段 · 综合评估',        ids:['20'] },
];
const TOTAL_UNITS = 20;
const UNITS = [
{ id:'01', stage:1, title:'Bluetooth 与 BLE 入门', tags:['Bluetooth Classic','低功耗设计','应用场景'],
  summary:'三个概念的关系 · 低功耗设计思想 · BLE 的能与不能',
  render(){
    return (
    '<h2>学习目标</h2>' +
    '<p>完成本单元后，你应当能够：</p><ul>' +
    '<li>向他人解释 Bluetooth、Bluetooth Classic（经典蓝牙）与 BLE 三者的关系，并指出单模设备与双模设备的区别。</li>' +
    '<li>用自己的话说明 BLE 低功耗的四个设计思想，而不是背诵名词。</li>' +
    '<li>给定一个具体应用场景（如温湿度传感器、无线耳机、信标），判断 BLE 是否是合适的技术并给出理由。</li>' +
    '<li>通过占空比演示器，预测广播间隔变化对设备平均功耗趋势的影响。</li></ul>' +

    '<h2>前置知识</h2><p>无。本单元是整门课程的起点。</p>' +

    '<h2>核心术语</h2>' +
    '<table class="tbl"><tr><th>术语</th><th>定义</th><th>易混淆点</th></tr>' +
    '<tr><td>Bluetooth（蓝牙）</td><td>Bluetooth SIG 管理的短距无线技术总称，包含多种技术分支</td><td>不要与“经典蓝牙”混用</td></tr>' +

    '<h2>1. 要解决的问题</h2>' +

    '又需要与智能手机这类人人随身携带的网关通信。Wi-Fi 功耗高、连接流程重；经典蓝牙面向音频与数据流，' +

    '<h2>3. 低功耗的四个设计思想</h2>' +

    '<div class="co co-warn"><div class="co-t">典型误区清单</div>' +
    '<p>① “BLE 与经典蓝牙只是速率不同”——错，是两套协议栈；② “低功耗 = 射频功率小”——错，核心是开启时间短，' +

  onMount(root){
    const sel = root.querySelector('#dcInterval'), selOn = root.querySelector('#dcOn');
    if(!sel) return;
    const tl = root.querySelector('#dcTimeline');
    const r1 = root.querySelector('#dcR1'), r2 = root.querySelector('#dcR2'), r3 = root.querySelector('#dcR3');
    function upd(){
      const itv = Number(sel.value), on = Number(selOn.value);
      const duty = on / itv * 100;
      tl.innerHTML = '<div class="on" style="width:' + Math.max(duty, 1.2) + '%"></div><div class="off"></div>';
      r1.textContent = itv >= 1000 ? (itv / 1000) + ' s' : itv + ' ms';
      r2.textContent = (1000 / itv).toFixed(1) + ' 次/s';
      r3.textContent = duty.toFixed(2) + ' %';
    }
    sel.addEventListener('input', upd); selOn.addEventListener('input', upd);
    root.querySelector('#dcReset').addEventListener('click', () => {
      sel.value = '1000'; selOn.value = '1'; upd();
    });
    upd();
  },

    'RSSI 只能做定性判断（明显变弱 → 大概率远或被遮挡）。Bluetooth 6.0 的 Channel Sounding 才是规范级的测距方案，' +

    '③ “发射功率越大越省电/越远就越好”——功率与距离是平方对数关系且直接抬高功耗，单元 14 专门讨论权衡。</p></div>' +

    '<h3>本单元总结</h3><p>BLE 使用 2.4 GHz ISM 频段的 40 个 2 MHz 间隔信道：3 个广播信道（2402/2426/2480 MHz，选址避开主流 Wi-Fi）负责设备发现，' +

    '<li><span class="tag">SPEC</span> Bluetooth Core Specification 5.4（HTML 全文）Vol 6 · Link Layer Specification 信道表：bluetooth.com/wp-content/uploads/Files/Specification/HTML/Core-54/out/en/low-energy-controller/link-layer-specification.html。</li>' +

  onMount(root){
    /* --- 信道图 --- */
    const map = root.querySelector('#chMap');
    if(!map) return;
    const W = 860, H = 118, X0 = 18, X1 = W - 14, F0 = 2400, F1 = 2484;
    const fx = f => X0 + (f - F0) / (F1 - F0) * (X1 - X0);
    let bars = '';
    const INFO = { adv:'广播信道（设备发现）', data:'数据信道（连接后通信）' };
    for(let n = 0; n <= 39; n++){
      const f = 2402 + 2 * n;
      const isAdv = (f === 2402 || f === 2426 || f === 2480);
      const chNo = isAdv ? (f === 2402 ? 37 : f === 2426 ? 38 : 39) : (f <= 2424 ? f / 2 - 1202 : f / 2 - 1203);
      bars += '<rect class="ch" data-f="' + f + '" data-adv="' + (isAdv ? 1 : 0) + '" data-ch="' + chNo + '" ' +
        'x="' + (fx(f) - 5) + '" y="' + (isAdv ? 26 : 44) + '" width="10" height="' + (isAdv ? 56 : 38) + '" rx="2" ' +
        'fill="' + (isAdv ? 'var(--accent)' : 'var(--muted)') + '" opacity="' + (isAdv ? 1 : .45) + '"><title>信道 ' + chNo + ' · ' + f + ' MHz</title></rect>';
      if(n % 4 === 0) bars += '<text x="' + fx(f) + '" y="' + (H - 6) + '" text-anchor="middle">' + f + '</text>';
    }
    function draw(wifi){
      let wifiRects = '';
      if(wifi){
        [2412, 2437, 2462].forEach(c => {
          wifiRects += '<rect x="' + fx(c - 10) + '" y="16" width="' + (fx(c + 10) - fx(c - 10)) + '" height="76" ' +
            'fill="var(--danger)" opacity=".18" rx="4"/><text x="' + fx(c) + '" y="14" text-anchor="middle">Wi-Fi ' + (c === 2412 ? 1 : c === 2437 ? 6 : 11) + '</text>';
        });
      }
      map.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' + wifiRects + bars +
        '<line x1="' + X0 + '" y1="100" x2="' + X1 + '" y2="100" stroke="var(--line)"/></svg>';
      map.querySelectorAll('.ch').forEach(r => r.addEventListener('click', () => {
        root.querySelector('#chInfo1').textContent = '信道 ' + r.dataset.ch + (r.dataset.adv === '1' ? '（广播）' : '（数据）');
        root.querySelector('#chInfo2').textContent = r.dataset.f + ' MHz';
        root.querySelector('#chInfo3').textContent = INFO[r.dataset.adv === '1' ? 'adv' : 'data'];
      }));
    }
    const cb = root.querySelector('#chWifi');
    cb.addEventListener('change', () => draw(cb.checked));
    root.querySelector('#chReset').addEventListener('click', () => { cb.checked = false; draw(false);
      root.querySelector('#chInfo1').textContent = '点击信道'; root.querySelector('#chInfo2').textContent = '—'; root.querySelector('#chInfo3').textContent = '—'; });
    draw(false);
    /* --- RSSI 估算 --- */
    const dist = root.querySelector('#rsDist'), tx = root.querySelector('#rsTx');
    const dv = root.querySelector('#rsDistV'), out = root.querySelector('#rsOut'), q = root.querySelector('#rsQ');
    function upd(){
      const d = Number(dist.value) / 10, p = Number(tx.value);
      dv.textContent = d + ' m';
      const rssi = Math.round(p - 40 - 20 * Math.log10(d));
      out.textContent = rssi + ' dBm';
      q.textContent = rssi > -60 ? '很强（非常近）' : rssi > -75 ? '较强（近）' : rssi > -85 ? '中等（可用）' : rssi > -95 ? '弱（易断）' : '极弱（大概率不可用）';
    }
    dist.addEventListener('input', upd); tx.addEventListener('change', upd);
    root.querySelector('#rsReset').addEventListener('click', () => { dist.value = 100; tx.value = '0'; upd(); });
    upd();
  },
  quiz:[
    { q:'BLE 在 2.4 GHz 频段划分的 40 个物理信道中，广播信道有多少个？',
      opts:['1 个','3 个（2402 / 2426 / 2480 MHz）','37 个','40 个全部都是广播信道'],
      ans:1,
      exp:'40 个信道 = 37 个数据信道（编号 0–36）+ 3 个广播信道（编号 37/38/39，中心频率 2402/2426/2480 MHz）。' },
    { q:'广播信道 37/38/39 选址的主要考量是：',
      opts:['频率最高以提升速率','尽量避开主流 Wi-Fi 信道的中心区域','与经典蓝牙兼容','随机选取'],
      ans:1,
      exp:'广播是设备被发现的唯一途径，选址时避开了 Wi-Fi 1/6/11 信道的中心区域，降低广播被强干扰淹没的概率；但只是概率性改善。' },
    { q:'下列关于 RSSI 的说法，错误的是：',
      opts:['RSSI 是接收端对信号强度的指示值','RSSI 可以精确换算出距离','墙体遮挡、人体、多径都会显著影响 RSSI','不同设备的 RSSI 读数不一定可比'],
      ans:1,
      exp:'RSSI 只能定性使用；“精确换算距离”是经典误区，相同 RSSI 可对应完全不同的物理场景。规范级测距是 Bluetooth 6.0 的 Channel Sounding，不在本课程硬件范围内。' },
    { q:'接收灵敏度“规范最低要求 −70 dBm（LE 1M PHY）”应当如何理解？',
      opts:['所有 BLE 芯片灵敏度都是 −70 dBm','这是 Core 规范对兼容实现的最低门槛，实际芯片通常显著更优','−70 dBm 是最优芯片的灵敏度','灵敏度与误码率无关'],
      ans:1,
      exp:'规范给出的是兼容性底线；具体芯片的灵敏度（例如能否达到 −90 dBm 量级）必须查该芯片 datasheet，不能拿规范最低值当芯片指标。' }
  ]
},
{ id:'03', stage:1, title:'设备角色与通信拓扑', tags:['GAP','Central','Peripheral','Broadcaster','Observer'],

  render(){

    '<tr><td>Broadcaster（广播者）</td><td>周期发送广播、不可连接的设备</td><td>不需要被任何人“听见”也照常工作</td></tr>' +

    '<h2>1. GAP 在解决什么问题</h2>' +

  onMount(root){

    const W = 860, H = 158, PADL = 14, PADR = 12, D = 600, DT = 0.35;
    const fx = t => PADL + (W - PADL - PADR) * (t / D);
    const ROW = { 37:26, 38:50, 39:74 }, WINY = 100, WINH = 22;
    let evs = [], wins = [], stats = null, cursor = 0, timer = null, playing = false, reveal = 0;

    const C = {};
    ['advC1','advC2','advC3','advC4','advC5'].forEach(id => C[id] = root.querySelector('#' + id));
    function rand(a, b){ return a + Math.random() * (b - a); }
    function gen(){
      const itv = +root.querySelector('#advItv').value;
      const sInt = +root.querySelector('#scanItv').value;
      let sWin = +root.querySelector('#scanWin').value;
      const clamped = sWin > sInt;
      if(sWin > sInt) sWin = sInt;
      root.querySelector('#advClamp').textContent = clamped
        ? '⚠ 输入的扫描窗口（' + root.querySelector('#scanWin').value + ' ms）大于扫描间隔：已按规范约束“窗口 ≤ 间隔”钳制为 ' + sInt + ' ms。'
        : '';
      const active = root.querySelector('#scanMode').value === 'active';
      evs = []; wins = [];
      let t = rand(0, itv), eid = 0;
      while(t < D){
        const t0 = t + rand(0, 10);
        if(t0 < D){
          evs.push({ t:t0, ch:37, k:'evt', eid });
          evs.push({ t:t0, ch:37, k:'adv', eid });
          evs.push({ t:t0 + DT, ch:38, k:'adv', eid });
          evs.push({ t:t0 + 2 * DT, ch:39, k:'adv', eid });
          eid++;
        }
        t = t0 + itv;
      }
      let w = rand(0, sInt), hop = Math.floor(Math.random() * 3);
      while(w < D){
        wins.push({ s:w, e:Math.min(w + sWin, D), ch:37 + hop });
        w += sInt; hop = (hop + 1) % 3;
      }
      const hit = new Set();
      evs.forEach((p, i) => {
        if(p.k !== 'adv' || hit.has(p.eid)) return;
        const ok = wins.some(wd => wd.ch === p.ch && wd.s <= p.t && p.t <= wd.e);
        if(ok){
          hit.add(p.eid);
          evs.push({ t:p.t + 0.6, ch:p.ch, k:'rx' });
          if(active){
            evs.push({ t:p.t + 1.8, ch:p.ch, k:'req' });
            evs.push({ t:p.t + 3.0, ch:p.ch, k:'rsp' });
          }
        }
      });
      evs.sort((a, b) => a.t - b.t);
      stats = {
        evt: new Set(evs.filter(e => e.k === 'evt').map(e => e.eid)).size,
        rx: hit.size,
        req: active ? hit.size : 0,
        rsp: active ? hit.size : 0,
        first: (evs.find(e => e.k === 'rx') || {}).t ?? null
      };
      reveal = 0;
    }
    function draw(){
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
      [37, 38, 39].forEach(ch => {
        s += '<text x="2" y="' + (ROW[ch] + 10) + '">信道' + ch + '</text>';
        s += '<line x1="' + PADL + '" y1="' + (ROW[ch] + 12) + '" x2="' + (W - PADR) + '" y2="' + (ROW[ch] + 12) + '" stroke="var(--line)"/>';
      });
      s += '<text x="2" y="' + (WINY + 14) + '">扫描</text>';
      wins.forEach(wd => {
        const x = fx(wd.s), w2 = Math.max(fx(wd.e) - x, 5);
        s += '<rect class="win" x="' + x + '" y="' + WINY + '" width="' + w2 + '" height="' + WINH + '" rx="4"/>';
        if(w2 > 46) s += '<text x="' + (x + 5) + '" y="' + (WINY + 14) + '" style="fill:var(--sim)">监听' + wd.ch + '</text>';
      });
      evs.forEach(e => {
        if(e.k === 'evt') return;
        const x = fx(e.t);
        if(e.k === 'adv') s += '<rect class="puls" x="' + (x - 1.5) + '" y="' + ROW[e.ch] + '" width="3" height="12" rx="1"/>';
        else if(e.k === 'req') s += '<rect class="req" x="' + (x - 2) + '" y="' + (ROW[e.ch] - 2) + '" width="4" height="16" rx="1"/>';
        else if(e.k === 'rsp') s += '<rect class="rsp" x="' + (x - 2) + '" y="' + (ROW[e.ch] - 2) + '" width="4" height="16" rx="1"/>';
      });
      s += '<line id="advCursor" x1="' + fx(cursor) + '" y1="14" x2="' + fx(cursor) + '" y2="' + (WINY + WINH) + '" stroke="var(--danger)" stroke-width="1.5" opacity="' + (cursor > 0 ? 1 : 0) + '"/>';
      s += '<text x="' + (W - PADR) + '" y="' + (H - 4) + '" text-anchor="end">时间轴 0 – 600 ms（包宽已放大）</text></svg>';
      svgBox.innerHTML = s;
    }

    }

      C.advC2.textContent = seen.filter(e => e.k === 'rx').length;
      C.advC3.textContent = seen.filter(e => e.k === 'req').length;
      C.advC4.textContent = seen.filter(e => e.k === 'rsp').length;
      C.advC5.textContent = firstRx ? firstRx.t.toFixed(1) + ' ms' : '—';
    }
    function revealUpTo(){
      while(reveal < evs.length && evs[reveal].t <= cursor){
        const e = evs[reveal];
        if(e.k === 'evt') addLog('<span style="color:var(--muted)">t=' + e.t.toFixed(1) + 'ms · 广播事件 #' + (e.eid + 1) + ' 开始（37→38→39）</span>');
        else if(e.k === 'rx') addLog('<b>t=' + e.t.toFixed(1) + 'ms · 收到 ADV @' + e.ch + '（扫描命中）</b>');
        else if(e.k === 'req') addLog('<b style="color:var(--warn)">t=' + e.t.toFixed(1) + 'ms · 回发 SCAN_REQ @' + e.ch + '</b>');
        else if(e.k === 'rsp') addLog('<b style="color:var(--ok)">t=' + e.t.toFixed(1) + 'ms · 收到 SCAN_RSP @' + e.ch + '（拿到扫描响应数据）</b>');
        reveal++;
      }
    }
    function playBtn(){
      root.querySelector('#advPlay').textContent = playing ? '⏸ 暂停' : '▶ 播放';
    }
    function tick(){
      cursor += 4;
      if(cursor >= D){ cursor = D; pause(); }
      draw(); revealUpTo(); updCounts();
    }
    function pause(){ playing = false; if(timer){ clearInterval(timer); timer = null; } playBtn(); }
    root.querySelector('#advPlay').addEventListener('click', () => {
      if(playing){ pause(); return; }
      if(cursor >= D){ cursor = 0; log.innerHTML = ''; reveal = 0; }
      playing = true; playBtn();
      timer = setInterval(tick, 40);
    });
    root.querySelector('#advStep').addEventListener('click', () => { pause(); cursor = Math.min(cursor + 5, D); draw(); revealUpTo(); updCounts(); });
    root.querySelector('#advReset').addEventListener('click', () => {
      pause(); cursor = 0; log.innerHTML = ''; reveal = 0; draw(); updCounts();
    });
    root.querySelector('#advReroll').addEventListener('click', () => {
      pause(); gen(); cursor = 0; log.innerHTML = ''; draw(); updCounts();
    });
    ['advItv','scanItv','scanWin','scanMode'].forEach(id =>
      root.querySelector('#' + id).addEventListener('change', () => {
        pause(); gen(); cursor = 0; log.innerHTML = ''; draw(); updCounts();
      }));
    addCleanup(() => { if(timer) clearInterval(timer); });
    gen(); draw(); updCounts();
  },

  onMount(root){
    const svgBox = root.querySelector('#cnSvg');
    if(!svgBox) return;
    const W = 860, H = 212, PADL = 14, PADR = 12, D = 600;
    const fx = t => PADL + (W - PADL - PADR) * (t / D);
    const yC = 44, yP = 168;
    let marks = [], cursor = 0, timer = null, playing = false, reveal = 0, counts = null;
    const log = root.querySelector('#cnLog');
    const C = {}; ['cnC1','cnC2','cnC3','cnC4'].forEach(id => C[id] = root.querySelector('#' + id));
    function gen(){
      const ci = +root.querySelector('#ciSel').value;
      const lat = +root.querySelector('#latSel').value;
      const sc = root.querySelector('#scSel').value;
      let to = +root.querySelector('#toSel').value;
      const need = (1 + lat) * ci * 2;
      let warn = '';
      if(to <= need){
        to = Math.ceil(need * 1.6 / 100) * 100;
        warn = '⚠ 规范约束：Timeout 必须 &gt; (1+Latency)×Interval×2 = ' + need + ' ms。已自动调整为 ' + to + ' ms。';
      } else {
        warn = '约束校验通过：(1+' + lat + ')×' + ci + '×2 = ' + need + ' ms &lt; Timeout ' + to + ' ms。';
      }
      root.querySelector('#cnWarn').innerHTML = '<span style="color:var(--' + (warn.indexOf('⚠') === 0 ? 'warn' : 'muted') + ')">' + warn + '</span>';
      marks = [];
      marks.push({ t:0.5, k:'ind' });
      marks.push({ t:2.5, k:'win' });
      const T0 = 2.5;
      const evts = [];
      for(let t = T0, i = 0; t < D; t += ci, i++) evts.push({ i, t });
      let sn = 0, lastRx = T0, retx = 0, ans = 0, state = '已连接', tTo = null, silentStarted = false;
      const silentFrom = sc === 'disconn' ? 2 : Infinity;
      let answeredSoFar = 0;
      evts.forEach(e => {
        const isAns = (e.i % (lat + 1)) === 0;
        if(!isAns){
          marks.push({ t:e.t, k:'skip' });
          return;
        }
        answeredSoFar++;
        if(answeredSoFar > silentFrom){
          silentStarted = true;
          marks.push({ t:e.t, k:'silent' });
          return;
        }
        if(sc === 'loss' && answeredSoFar === 2){
          marks.push({ t:e.t, k:'loss', sn });
          return;
        }
        const isRetx = (sc === 'loss' && answeredSoFar === 3 && !marks.some(m => m.k === 'retx'));
        marks.push({ t:e.t, k: isRetx ? 'retx' : 'ok', sn });
        sn = 1 - sn;
        if(isRetx) retx++;
        ans++;
        lastRx = e.t;
      });
      if(sc === 'disconn' && silentStarted){
        tTo = lastRx + to;
        if(tTo < D){ marks.push({ t:tTo, k:'timeout' }); state = '已断连（超时）'; }
        else { state = '外设已静默（超时点 ' + Math.round(tTo) + ' ms 在轴外）'; }
      } else if(sc === 'loss' && marks.some(m => m.k === 'loss')){ state = '正常（含 1 次重传恢复）'; }
      counts = { ev:evts.length, ans, retx, state };
      reveal = 0;
    }
    function draw(){
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
      s += '<text x="4" y="20" class="laneT">中央设备（Central）</text>';
      s += '<text x="4" y="' + (H - 6) + '" class="laneT">外设（Peripheral）</text>';
      s += '<line class="lane" x1="' + PADL + '" y1="' + yC + '" x2="' + (W - PADR) + '" y2="' + yC + '"/>';
      s += '<line class="lane" x1="' + PADL + '" y1="' + yP + '" x2="' + (W - PADR) + '" y2="' + yP + '"/>';
      marks.forEach(m => {
        const x = fx(m.t);
        if(m.k === 'ind'){
          s += '<rect x="' + (x - 8) + '" y="' + (yC - 12) + '" width="16" height="10" rx="2" style="fill:var(--spec)"/>';
          s += '<line class="indline" x1="' + x + '" y1="' + (yC + 4) + '" x2="' + x + '" y2="' + (yP - 6) + '"/>';
          s += '<text x="' + (x + 4) + '" y="' + ((yC + yP) / 2) + '" style="fill:var(--spec)">CONNECT_IND</text>';

          const lost = m.k === 'loss';
          s += '<line class="c2p' + (lost ? ' lost' : '') + '" x1="' + x + '" y1="' + (yC + 4) + '" x2="' + x + '" y2="' + (yP - 8) + '"/>';
          if(lost) s += '<text x="' + (x + 3) + '" y="' + (yP - 12) + '" style="fill:var(--danger)">✗ 丢失</text>';
          else s += '<line class="p2c" x1="' + (x + 0.9) + '" y1="' + (yP - 8) + '" x2="' + (x + 0.9) + '" y2="' + (yC + 6) + '"/>';
          if(m.k === 'retx') s += '<text x="' + (x + 3) + '" y="' + (yC + 14) + '" style="fill:var(--warn)">重传 SN=' + m.sn + '</text>';
        } else if(m.k === 'skip'){
          s += '<circle class="skipc" cx="' + x + '" cy="' + (yP - 10) + '" r="5"/>';
        } else if(m.k === 'silent'){
          s += '<text x="' + (x - 4) + '" y="' + (yP - 16) + '" style="fill:var(--danger)">✗ 静默</text>';
        } else if(m.k === 'timeout'){
          s += '<line class="toline" x1="' + x + '" y1="30" x2="' + x + '" y2="' + (yP + 4) + '"/>';
          s += '<text x="' + (x + 4) + '" y="40" style="fill:var(--danger)">Supervision Timeout → 断连</text>';
        }
      });
      s += '<line id="cnCursor" x1="' + fx(cursor) + '" y1="24" x2="' + fx(cursor) + '" y2="' + (yP + 2) + '" stroke="var(--danger)" stroke-width="1.5" opacity="' + (cursor > 0 ? 1 : 0) + '"/>';
      s += '<text x="' + (W - PADR) + '" y="' + (H - 22) + '" text-anchor="end">时间轴 0 – 600 ms</text></svg>';

    function addLog(html){
      const d = document.createElement('div');
      d.innerHTML = html;
      log.appendChild(d);

    const TXT = {
      ind: m => 't=' + m.t + 'ms · <b style="color:var(--spec)">CONNECT_IND</b>（同一广播信道回发）：分配 AA=0xC471B2（教学随机值）、CRCInit、Interval/Latency/Timeout、信道图与 Hop',
      win: m => 't=' + m.t + 'ms · 发送窗口结束 → 进入连接态，事件按 ConnInterval 重复',
      ok: m => 't=' + m.t + 'ms · C→P 数据 SN=' + m.sn + ' ↓；150 μs 内 P→C 确认 ↑（对端序列号翻转）',
      retx: m => 't=' + m.t + 'ms · <b style="color:var(--warn)">C→P 重传 SN=' + m.sn + '</b>（与丢失包相同）→ 本次确认 ✓',
      loss: m => 't=' + m.t + 'ms · <b style="color:var(--danger)">C→P 包丢失 ✗</b>（未收到确认，保留 SN 等待重传）',
      skip: m => '<span style="color:var(--muted)">t=' + m.t + 'ms · 外设按 Latency 跳过本事件（射频休眠）</span>',
      silent: m => 't=' + m.t + 'ms · <b style="color:var(--danger)">外设停止应答</b>（教学注入）',
      timeout: m => 't=' + m.t + 'ms · <b style="color:var(--danger)">连续静默达 Supervision Timeout → 链路断连</b>'
    };
    function revealUpTo(){
      while(reveal < marks.length && marks[reveal].t <= cursor){
        const m = marks[reveal];
        if(TXT[m.k]) addLog(TXT[m.k](m));
        reveal++;
      }
    }
    function updCounts(){
      const seen = marks.slice(0, reveal);
      C.cnC1.textContent = seen.filter(m => m.k === 'ok' || m.k === 'retx' || m.k === 'loss' || m.k === 'skip' || m.k === 'silent').length;
      C.cnC2.textContent = seen.filter(m => m.k === 'ok' || m.k === 'retx').length;
      C.cnC3.textContent = seen.filter(m => m.k === 'retx').length;
      C.cnC4.textContent = seen.some(m => m.k === 'timeout') ? '已断连（超时）' : (counts ? counts.state : '已连接');
    }
    function playBtn(){ root.querySelector('#cnPlay').textContent = playing ? '⏸ 暂停' : '▶ 播放'; }
    function tick(){
      cursor += 4;
      if(cursor >= D){ cursor = D; pause(); }
      draw(); revealUpTo(); updCounts();
    }
    function pause(){ playing = false; if(timer){ clearInterval(timer); timer = null; } playBtn(); }
    root.querySelector('#cnPlay').addEventListener('click', () => {
      if(playing){ pause(); return; }
      if(cursor >= D){ cursor = 0; log.innerHTML = ''; reveal = 0; }
      playing = true; playBtn();
      timer = setInterval(tick, 40);
    });
    root.querySelector('#cnStep').addEventListener('click', () => { pause(); cursor = Math.min(cursor + 5, D); draw(); revealUpTo(); updCounts(); });
    root.querySelector('#cnReset').addEventListener('click', () => { pause(); cursor = 0; log.innerHTML = ''; reveal = 0; draw(); updCounts(); });
    root.querySelector('#cnReroll').addEventListener('click', () => { pause(); gen(); cursor = 0; log.innerHTML = ''; draw(); updCounts(); });
    ['ciSel','latSel','toSel','scSel'].forEach(id =>
      root.querySelector('#' + id).addEventListener('change', () => { pause(); gen(); cursor = 0; log.innerHTML = ''; draw(); updCounts(); }));
    addCleanup(() => { if(timer) clearInterval(timer); });
    gen(); draw(); updCounts();
  },

    function dataBytes(){

      const aa = [0xC4,0x71,0xB2,0x07];

        { n:'前导 Preamble', b:[0x55], m:'同广播包；数据包前导与 AA 首字节组成交替序列', lim:'1 字节', r:'Vol 6 Part B' },

        { n:'CRC（教学省略实值）', b:[0x00,0x00,0x00], m:'CRC-24，初值 = 本连接的 CRCInit（CONNECT_IND 分配）', lim:'——', r:'Vol 6 Part B' }
      ];
    }
    function render(){
      const fields = typeSel.value === 'adv' ? advBytes() : dataBytes();
      let colorIdx = 0, all = [];
      strip.innerHTML = fields.map(f => {

          all.push(HEX(x));
          return '<span class="b" style="background:' + c + '" title="' + f.n + '">' + HEX(x) + '</span>';
        }).join('');
      }).join('');

    }
    function buildCtrls(){
      if(typeSel.value === 'adv'){
        ctrlBox.innerHTML =
          '<label>TxAdd <select id="pkTx"><option value="0">0 · 公共地址</option><option value="1">1 · 随机地址</option></select></label>' +
          '<label>AD 数据 <select id="pkAd"><option value="name">Flags+完整设备名</option><option value="uuid">Flags+16位UUID列表</option><option value="mfr">Flags+厂商数据</option></select></label>';
        ctrlBox.querySelector('#pkTx').value = st.txadd;
        ctrlBox.querySelector('#pkAd').value = st.ad;
        ctrlBox.querySelector('#pkTx').addEventListener('change', e => { st.txadd = +e.target.value; render(); });
        ctrlBox.querySelector('#pkAd').addEventListener('change', e => { st.ad = e.target.value; render(); });
      } else {
        ctrlBox.innerHTML =
          '<label>LLID <select id="pkLlid"><option value="1">1 · 续包</option><option value="2" selected>2 · 数据起始</option><option value="3">3 · 链路控制</option></select></label>' +
          '<label>NESN <select id="pkNesn"><option value="0">0</option><option value="1" selected>1</option></select></label>' +
          '<label>SN <select id="pkSn"><option value="0" selected>0</option><option value="1">1</option></select></label>' +
          '<label>MD <select id="pkMd"><option value="0">0</option><option value="1" selected>1</option></select></label>' +
          '<label>净荷长度 <input type="range" id="pkLen" min="0" max="31" value="' + st.dlen + '"><span class="readout" id="pkLenV">' + st.dlen + 'B</span></label>';
        const bind = (id, key) => { const el = ctrlBox.querySelector('#' + id); el.value = st[key];
          el.addEventListener('change', e => { st[key] = +e.target.value; render(); }); };
        bind('pkLlid','llid'); bind('pkNesn','nesn'); bind('pkSn','sn'); bind('pkMd','md');
        const len = ctrlBox.querySelector('#pkLen');
        len.addEventListener('input', e => { st.dlen = +e.target.value; ctrlBox.querySelector('#pkLenV').textContent = st.dlen + 'B'; render(); });
      }
      render();
    }
    typeSel.addEventListener('change', buildCtrls);
    buildCtrls();
  },

      const v = c.value;
      if(c.fmt === 'hr') return hexOf(v) + '（Flags=' + v[0] + '，BPM=' + v[1] + '）';
      if(c.fmt === 'loc'){ const nm = ({0:'其他',1:'胸部',2:'手腕',3:'手指',4:'手',5:'耳垂',6:'脚'})[v[0]] || ('保留值 ' + v[0]); return hexOf(v) + '（' + nm + '）'; }
      if(c.fmt === 'pct') return hexOf(v) + '（' + v[0] + '%）';
      return hexOf(v);
    }
    function renderTree(){
      const svcStart = { hr:0x0001, custom:0x0011 }[sc];
      const svcUuid = { hr:'0x180D / 0x180F', custom:'128-bit 主服务' }[sc];
      let rows = '<tr><th>句柄</th><th>类型</th><th>属性能力</th><th>当前值</th></tr>';
      rows += '<tr class="svc"><td>0x' + HEX(svcStart >> 8) + HEX(svcStart & 255) + '</td><td colspan="3">主服务声明 0x2800：' + svcUuid + '</td></tr>';
      chars.forEach((c, i) => {
        const on = k => c.props.indexOf(k) >= 0;
        const props = ['read','write','writeCmd','notify','indicate'].map(k =>
          '<span class="' + (on(k) ? 'on' : '') + '">' + PROPN[k] + '</span>').join('');
        rows += '<tr class="chrow' + (i === sel ? ' sel' : '') + '" data-i="' + i + '"><td>0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '</td>' +
          '<td>' + c.name + '<br><span style="color:var(--muted);font-size:.85em">' + c.uuid + '</span></td>' +
          '<td class="props">' + props + '</td><td class="gatt-val">' + decode(c) + '</td></tr>';
      });
      treeBox.innerHTML = '<table class="gatt-tree">' + rows + '</table>';
      treeBox.querySelectorAll('.chrow').forEach(r => r.addEventListener('click', () => {
        sel = +r.dataset.i;
        const c = chars[sel];
        selBox.textContent = c.name + '（0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '）';
        renderTree();
      }));
    }
    function opHeader(gatt, att){
      addLog('<span style="color:var(--muted)">GATT：' + gatt + ' → ATT：' + att + '</span>');
    }
    function needSel(){ if(sel < 0){ addLog('<span style="color:var(--warn)">请先在左侧点击选中一个特征值。</span>'); return true; } return false; }
    function doRead(){
      if(needSel()) return;
      const c = chars[sel];
      opHeader('读 "' + c.name + '"', 'Read Request 0x0A（handle 0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '）');
      if(c.props.indexOf('read') < 0){ addLog('<b style="color:var(--danger)">← Error Response 0x01：Read Not Permitted（0x02）——该特征值未声明读能力</b>'); return; }
      if(c.perm.read === 'auth' && !authBox.checked){ addLog('<b style="color:var(--danger)">← Error Response 0x01：Insufficient Authentication（0x05）——需要加密认证（勾选上方“已完成认证”再试）</b>'); return; }
      addLog('<b style="color:var(--ok)">← Read Response 0x0B：' + decode(c) + '</b>');
    }
    function parseInput(){
      const t = root.querySelector('#gtVal').value.trim();
      const out = [];
      for(const ch of t) out.push(ch.charCodeAt(0) & 255);
      return out.length ? out : [0x00];
    }
    function doWrite(cmd){
      if(needSel()) return;
      const c = chars[sel];
      const key = cmd ? 'writeCmd' : 'write';
      opHeader((cmd ? '无应答写入' : '写入') + ' "' + c.name + '"',
        cmd ? 'Write Command 0x52（无响应）' : 'Write Request 0x12（handle 0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '）');
      if(c.props.indexOf(key) < 0){
        addLog('<b style="color:var(--danger)">← ' + (cmd ? '该特征值未声明“无应答写”能力（Write Command 被拒）' : 'Error Response 0x01：Write Not Permitted（0x03）') + '</b>');
        return;
      }
      if(c.perm.write === 'auth' && !authBox.checked){ addLog('<b style="color:var(--danger)">← Error Response 0x01：Insufficient Authentication（0x05）</b>'); return; }
      c.value = parseInput();
      if(!cmd) addLog('<b style="color:var(--ok)">← Write Response 0x13（写入成功，数据库已更新）</b>');
      else addLog('<b style="color:var(--ok)">（无应答写入：无响应包；数据库已更新，结果不可靠确认）</b>');
      renderTree();
    }
    function doSub(kind){
      if(needSel()) return;
      const c = chars[sel];
      if(kind === 'n' && c.props.indexOf('notify') < 0){ addLog('<b style="color:var(--danger)">该特征值不支持通知（无 notify 能力位）</b>'); return; }
      if(kind === 'i' && c.props.indexOf('indicate') < 0){ addLog('<b style="color:var(--danger)">该特征值不支持指示（无 indicate 能力位）</b>'); return; }
      const val = kind === 'n' ? 0x0001 : 0x0002;
      opHeader('订阅' + (kind === 'n' ? '通知' : '指示'), 'Write Request 0x12（CCCD 0x2902 @ handle 0x' + HEX(c.cccd >> 8) + HEX(c.cccd & 255) + '，值 0x' + HEX(val >> 8) + HEX(val & 255) + '）');
      addLog('<b style="color:var(--ok)">← Write Response 0x13：订阅生效' + (kind === 'n' ? '（服务器将开始发送 Notification 0x1B）' : '（服务器将开始发送 Indication 0x1D，需等客户端 Confirmation 0x1E）') + '</b>');
      subs[c.vh] = kind;
    }
    function doPush(kind){
      if(needSel()) return;
      const c = chars[sel];
      const k = kind === 'n' ? 'n' : 'i';
      if(subs[c.vh] !== k){ addLog('<span style="color:var(--warn)">服务器不会发送：该特征值的 CCCD 未启用' + (kind === 'n' ? '通知' : '指示') + '（教学模拟服务端行为）</span>'); return; }
      if(c.fmt === 'hr') c.value = [0x00, 60 + Math.floor(Math.random() * 40)];
      if(c.fmt === 'pct') c.value = [Math.max(5, Math.min(100, c.value[0] + (Math.random() < 0.5 ? -3 : 5)))];
      if(c.fmt === 'raw') c.value = [c.value[0] ^ 0x01];
      if(kind === 'n'){
        opHeader('发送通知', 'Handle Value Notification 0x1B（handle 0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '）——无需确认');
        addLog('<b style="color:var(--ok)">客户端收到：' + decode(c) + '</b>');
      } else {
        opHeader('发送指示', 'Handle Value Indication 0x1D（handle 0x' + HEX(c.vh >> 8) + HEX(c.vh & 255) + '）——等待确认');
        addLog('<b style="color:var(--ok)">← Handle Value Confirmation 0x1E（客户端确认，服务器才能发下一条）</b>');
      }
      renderTree();
    }
    root.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
      const op = b.dataset.op;
      if(op === 'read') doRead();
      else if(op === 'wreq') doWrite(false);
      else if(op === 'wcmd') doWrite(true);
      else if(op === 'subn') doSub('n');
      else if(op === 'subi') doSub('i');
      else if(op === 'pushn') doPush('n');
      else if(op === 'pushi') doPush('i');
    }));
    function load(name){
      sc = name; chars = SCN[name].chars; sel = -1; subs = {};
      selBox.textContent = '未选择';
      logBox.innerHTML = '';
      addLog('<span style="color:var(--muted)">已加载场景：' + SCN[name].label + '。先在左侧选中特征值，再执行操作。</span>');
      renderTree();
    }
    root.querySelector('#gtScene').addEventListener('change', e => load(e.target.value));
    root.querySelector('#gtReset').addEventListener('click', () => load(root.querySelector('#gtScene').value));
    load('hr');
  },

  onMount(root){
    const mtu = root.querySelector('#mMtu');
    if(!mtu) return;
    const vlen = root.querySelector('#mLen'), dle = root.querySelector('#mDle'), phy = root.querySelector('#mPhy');
    const bar = root.querySelector('#mBar');
    const R = {}; ['mR1','mR2','mR3','mR4','mR5','mMtuV','mLenV'].forEach(id => R[id] = root.querySelector('#' + id));
    function calc(){
      const M = +mtu.value, L = +vlen.value, D = +dle.value, P = +phy.value;
      R.mMtuV.textContent = M; R.mLenV.textContent = L + ' B';
      const chunk = M - 3;
      const seg = Math.ceil(L / chunk);
      let airPkts = 0, airBytes = 0, attHdr = 0, valBytes = 0, llHdr = 0, airFixed = 0;
      let tUs = 0, remain = L;
      for(let i = 0; i < seg; i++){
        const data = Math.min(chunk, remain); remain -= data;
        valBytes += data;
        const attPdu = 3 + data; attHdr += 3;
        let rem = attPdu;
        while(rem > 0){
          const pay = Math.min(D, rem); rem -= pay;
          airPkts++; llHdr += 2; airFixed += 10;
          const pkt = pay + 2 + 10;
          airBytes += pkt;
          tUs += pkt * 8 / P + 150;
        }
      }
      const eff = (valBytes / airBytes * 100);
      const tput = valBytes / (tUs / 1000); // 字节/毫秒 = kB/s
      R.mR1.textContent = seg;
      R.mR2.textContent = airPkts;
      R.mR3.textContent = airBytes + ' B';
      R.mR4.textContent = eff.toFixed(1) + ' %';
      R.mR5.textContent = tput.toFixed(0) + ' kB/s';
      const w = x => (x / airBytes * 100).toFixed(2) + '%';
      bar.innerHTML =
        '<div style="width:' + w(valBytes) + ';background:var(--ok)"></div>' +
        '<div style="width:' + w(attHdr) + ';background:var(--accent)"></div>' +
        '<div style="width:' + w(llHdr) + ';background:var(--sim)"></div>' +
        '<div style="width:' + w(airFixed) + ';background:var(--muted);opacity:.5"></div>';
    }
    [mtu, vlen].forEach(el => el.addEventListener('input', calc));
    [dle, phy].forEach(el => el.addEventListener('change', calc));
    root.querySelector('#mReset').addEventListener('click', () => {
      mtu.value = 247; vlen.value = 244; dle.value = '251'; phy.value = '1'; calc();
    });
    calc();
  },

{ id:'12', stage:4, title:'BLE 安全机制', tags:['Pairing','Bonding','LE Secure Connections','MITM'],
  summary:'配对与绑定 · 关联模型与 MITM · Legacy vs LE SC · 配对流程图',
  render(){
    return (
    '<h2>学习目标</h2><ul>' +
    '<li>区分配对与绑定、认证与加密四组概念，不再当同义词使用。</li>' +
    '<li>说出 Legacy Pairing 与 LE Secure Connections（4.2）的核心差异（STK vs ECDH 直派 LTK）。</li>' +
    '<li>按关联模型判断一条链路是否具备 MITM 保护。</li>' +
    '<li>解释安全模式 1 的四个级别各对应什么状态。</li></ul>' +

    '<h2>前置知识</h2><p><a href="#/u/10">单元 10</a>（ATT 操作与权限错误码）；<a href="#/u/09">单元 09</a>（Permissions）。</p>' +

    '<h2>核心术语</h2>' +
    '<table class="tbl"><tr><th>术语</th><th>定义</th><th>易混淆点</th></tr>' +
    '<tr><td>Pairing（配对）</td><td>两设备建立密钥的过程</td><td>配对 ≠ 绑定</td></tr>' +
    '<tr><td>Bonding（绑定）</td><td>把配对得到的密钥持久化，重连时直接使用</td><td>只配对不绑定 = 重连要重来</td></tr>' +
    '<tr><td>Encryption（加密）</td><td>链路层用会话密钥加密净荷——保机密性</td><td>加密 ≠ 认证（不知对端是谁）</td></tr>' +
    '<tr><td>Authentication（认证）</td><td>确认对端身份/用户在场——防中间人（MITM）</td><td>通过 Passkey/数字比较获得，而非加密本身</td></tr>' +
    '<tr><td>TK / STK / LTK</td><td>临时密钥 / 短期密钥（Legacy）/ 长期密钥</td><td>LE SC 没有 STK，LTK 由 DHKey 直接派生</td></tr>' +
    '<tr><td>RPA（可解析私有地址）</td><td>用 IRK 轮换生成的设备地址——防跟踪</td><td>隐私靠 IRK 解析，不是靠加密</td></tr></table>' +

    '<h2>1. 配对在解决什么问题</h2>' +
    '<p>两台互不相识的设备要在 2.4 GHz 上建立一条<strong>别人解不开、且对方确实是“它”</strong>的链路。' +
    '这就是配对（协商出密钥）+ 认证（确认身份）+ 加密（链路层生效）+ 绑定（下次免谈）四步的由来。' +
    'SMP（单元 04）负责协商，链路层负责用密钥加密——分工再次强调：<strong>SMP 在 Host 谈判，加密在 Controller 执行</strong><span class="tag">SPEC</span>。</p>' +

    '<h2>2. 关联模型与 MITM</h2>' +
    '<table class="tbl"><tr><th>关联模型</th><th>共享秘密来源</th><th>MITM 保护</th><th>适用</th></tr>' +
    '<tr><td>Just Works</td><td>无（TK = 0 / 无用户确认）</td><td><strong>无</strong>——只防被动窃听（LE SC 下）</td><td>无显示屏/无按键设备</td></tr>' +
    '<tr><td>Passkey</td><td>6 位十进制口令（10⁶ 空间）</td><td><strong>有</strong>（20 轮确认摊薄猜测）</td><td>一端可输入/显示</td></tr>' +
    '<tr><td>数字比较（Numeric Comparison）</td><td>两端显示同码，用户确认一致</td><td><strong>有</strong></td><td><strong>仅 LE Secure Connections</strong></td></tr>' +
    '<tr><td>OOB（带外）</td><td>NFC 等带外通道传递秘密</td><td>取决于带外通道</td><td>有 NFC 等硬件</td></tr></table>' +
    '<div class="co co-warn"><div class="co-t">典型误区：加密 = 安全</div>' +
    '<p>Just Works 在 LE SC 下也能建立加密链路，但<strong>没有 MITM 保护</strong>：攻击者可在中间各与一方“正常配对”。' +
    '防 MITM 的本质是“带外共享的秘密”（人眼比对/输入/NFC），不是算法强度。</p></div>' +

    '<div class="widget"><div class="w-head"><span class="w-title">交互 · 配对流程图（Legacy vs LE SC）</span>' +
    '<span class="w-note">选择关联模型查看 MITM 结论</span></div>' +
    '<div class="ctrl"><label>关联模型<select id="pmSel">' +
    '<option value="jw">Just Works</option><option value="pk">Passkey</option>' +
    '<option value="nc">数字比较（仅 LE SC）</option></select></label>' +
    '<span id="pmVerdict" style="font-weight:700"></span></div>' +
    '<div id="pmSteps"></div></div>' +

    '<h2>3. Legacy Pairing vs LE Secure Connections</h2>' +
    '<p>两本教材成书于 4.0 时代，只覆盖 Legacy 配对（TK/STK 体系）<span class="tag">BOOK</span>；' +
    'Core 4.2 引入 LE Secure Connections（ECDH P-256）后，密钥协商改为椭圆曲线 Diffie-Hellman，' +
    '<strong>LTK 直接由 DHKey 派生、不再需要 STK 与 LTK 分发</strong>，被动窃听者即使全程监听也无法算出密钥<span class="tag">VERSION-DELTA</span><span class="tag">SPEC</span>。' +
    '上表中的“数字比较”更是 LE SC 专属——Legacy 体系没有这个模型。</p>' +
    '<table class="tbl"><caption>安全模式 1 的级别（Mode 2/3 涉及签名与广播加密，见规范）</caption>' +
    '<tr><th>级别</th><th>状态</th></tr>' +
    '<tr><td>1</td><td>无安全（明文）</td></tr>' +
    '<tr><td>2</td><td>非认证配对加密（如 Just Works）</td></tr>' +
    '<tr><td>3</td><td>认证配对加密（Passkey/数字比较）</td></tr>' +
    '<tr><td>4（4.2+）</td><td>LE SC 认证加密</td></tr></table>' +

    '<h2>练习与误区</h2>' +
    '<div class="co"><div class="co-t">基础理解练习</div>' +
    '<p>用流程图复述：Just Works 下 LE SC 配对的六步，并指出哪一步“给了攻击者可乘之机”。</p></div>' +
    '<div class="co"><div class="co-t">应用练习</div>' +
    '<p>门锁产品要求“开锁操作必须防 MITM”。选择关联模型并说明 UI 需要什么硬件（屏幕或按键）。</p></div>' +
    '<div class="co co-warn"><div class="co-t">典型误区</div>' +
    '<p>① “绑定了就永远安全”——密钥泄露/删除后需重新配对；② “加密链路上的对端就是真机”——未认证加密链路仍可被中间人；' +

  onMount(root){
    const ci = root.querySelector('#wCi');
    if(!ci) return;
    const lat = root.querySelector('#wLat'), n = root.querySelector('#wN');
    const R = {}; ['wCiV','wNV','wR1','wR2','wR3','wR4','wTrend'].forEach(id => R[id] = root.querySelector('#' + id));
    const BASE = { duty: null, rate: null };
    function calc(init){
      const C = +ci.value, L = +lat.value, N = +n.value;
      R.wCiV.textContent = C + ' ms'; R.wNV.textContent = N;
      const tEvent = N === 0 ? 300 : 750 + (N - 1) * 450; // μs
      const wake = (1 + L) * C;                            // ms
      const duty = tEvent / 1000 / wake * 100;             // %
      const rate = N * 20 / C;                             // B/ms = kB/s（N>0）
      const perByte = N > 0 ? tEvent / (N * 20) : null;    // μs/B
      R.wR1.textContent = N > 0 ? rate.toFixed(2) + ' kB/s' : '0（仅保活）';
      R.wR2.textContent = duty.toFixed(3) + ' %';
      R.wR3.textContent = perByte === null ? '—' : perByte.toFixed(0) + ' μs/B';
      R.wR4.textContent = wake + ' ms';
      if(init){ BASE.duty = duty; BASE.rate = rate || 0.2; }
      const idx = N > 0 ? (duty / rate) / (BASE.duty / BASE.rate) : duty / (BASE.duty * 20 / (BASE.rate || 1));
      const dir = idx > 1.15 ? '高于基线' : idx < 0.85 ? '低于基线' : '与基线相当';
      R.wTrend.innerHTML = '相对每字节能耗指数：<b>' + (N > 0 ? idx.toFixed(2) : '∞（无数据）') + '</b>（基线 = 1.00，当前' + dir + '）。' +
        '规律：提高 N 摊薄开销、加大 CI+L 降低占空比——两者方向相反，匹配业务节奏才是答案。';
    }
    ci.addEventListener('input', () => calc(false));
    lat.addEventListener('change', () => calc(false));
    n.addEventListener('input', () => calc(false));
    root.querySelector('#wReset').addEventListener('click', () => {
      ci.value = 100; lat.value = '2'; n.value = 1; calc(true);
    });
    calc(true);
  },

      Object.keys(answered).forEach(k => { if(answered[k] === ANS[k]) right++; });
      doneEl.textContent = done + ' / 8';
      scoreEl.textContent = (right * 10) + ' / 80';

        card.querySelector('.exp').classList.add('show');
        upd();
      }));
    });

      const el = root.querySelector('#rev_' + b.dataset.reveal);
      if(el) el.classList.toggle('show');

/* ---------- 5. 侧栏 ---------- */
function renderSidebar(){
  const filter = (document.getElementById('unitFilter').value || '').trim().toLowerCase();
  const cur = currentUnitId();
  let html = '';
  STAGES.forEach(st => {
    const items = st.ids.map(id => {
      const u = UNITS.find(x => x.id === id);
      if(!u) return '';
      const label = u.id + ' ' + u.title;
      if(filter && !label.toLowerCase().includes(filter) && !(u.tags||[]).join(' ').toLowerCase().includes(filter)) return '';
      const cls = ['unit-item'];
      if(u.wip) cls.push('wip'); else cls.push(id === cur ? 'active' : '');
      if(state.done[u.id]) cls.push('done');
      return '<button class="' + cls.join(' ').trim() + '" data-unit="' + u.id + '" title="' + esc(u.title) + '">' +
        '<span class="no">' + u.id + '</span><span>' + esc(u.title) + '</span>' +
        (u.wip ? '<span class="badge">建设中</span>' : '<span class="dot" title="已掌握状态"></span>') +
        '</button>';
    }).join('');
    if(items) html += '<div class="stage-title">' + st.name + '</div>' + items;
  });
  const nav = document.getElementById('navList');
  nav.innerHTML = html || '<p style="color:var(--muted);font-size:.9em;padding:8px">没有匹配的单元</p>';
  nav.querySelectorAll('[data-unit]').forEach(btn => {
    btn.addEventListener('click', () => { location.hash = '#/u/' + btn.dataset.unit; closeSidebar(); });
  });
}

/* ---------- 6. 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  searchIndex = UNITS.filter(u => !u.wip).map(u => {
    const div = document.createElement('div');
    div.innerHTML = u.render();
    const text = (div.textContent || '').replace(/\s+/g, ' ');
    return { id:u.id, title:u.title, text:text };
  });
}
function doSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.style.display = 'none'; box.innerHTML = ''; return; }
  if(!searchIndex) buildSearchIndex();
  const hits = [];
  searchIndex.forEach(it => {
    const tp = it.title.toLowerCase().indexOf(q);
    const xp = it.text.toLowerCase().indexOf(q);
    if(tp >= 0 || xp >= 0){
      let snippet = '';
      if(xp >= 0){
        const s = Math.max(0, xp - 30);
        snippet = (s > 0 ? '…' : '') + it.text.slice(s, xp + 60) + '…';
      }
      hits.push({ id:it.id, title:it.title, snippet });
    }
  });
  box.innerHTML = hits.length
    ? hits.slice(0, 12).map(h =>
        '<button class="sr" data-unit="' + h.id + '"><b>' + esc(h.title) + '</b>' +
        '<span class="path">单元 ' + h.id + ' · ' + esc(h.snippet.slice(0, 90)) + '</span></button>').join('')
    : '<div class="sr" style="color:var(--muted)">没有找到“' + esc(q) + '”相关内容</div>';
  box.style.display = 'block';
  box.querySelectorAll('[data-unit]').forEach(el =>
    el.addEventListener('click', () => {
      location.hash = '#/u/' + el.dataset.unit;
      box.style.display = 'none';
      document.getElementById('searchInput').value = '';
    }));
}

/* ---------- 7. 测验引擎 ---------- */
function quizHtml(u){
  if(!u.quiz || !u.quiz.length) return '';
  return '<h2>自测题 <span class="tag">答题状态自动保存</span></h2>' +
    '<div class="quiz" id="quizBody">' + u.quiz.map((q, qi) =>
      '<div class="qcard" data-qi="' + qi + '">' +
      '<div class="q">Q' + (qi + 1) + ' · ' + q.q + '</div>' +
      '<div class="opts">' + q.opts.map((o, oi) =>
        '<label><input type="radio" name="q' + u.id + '_' + qi + '" value="' + oi + '"><span>' + o + '</span></label>'
      ).join('') + '</div>' +
      '<button class="btn primary" data-check="' + qi + '">检查本题</button>' +
      '<div class="exp" data-exp="' + qi + '"><b>解析：</b>' + q.exp + '</div>' +
      '</div>').join('') +
    '<div class="quiz-result" id="quizResult" aria-live="polite"></div></div>';
}
function bindQuiz(root, u){
  if(!u.quiz || !u.quiz.length) return;
  const saved = (state.quiz[u.id] && state.quiz[u.id].answers) || {};
  u.quiz.forEach((q, qi) => {
    const card = root.querySelector('[data-qi="' + qi + '"]');
    if(saved[qi] !== undefined){
      const inp = card.querySelector('input[value="' + saved[qi] + '"]');
      if(inp){ inp.checked = true; judge(card, qi, Number(saved[qi]), u, true); }
    }
    card.querySelector('[data-check]').addEventListener('click', () => {
      const sel = card.querySelector('input:checked');
      if(!sel){ flashResult(root, 'Q' + (qi + 1) + ' 还未选择答案。'); return; }
      const val = Number(sel.value);
      const rec = state.quiz[u.id] || (state.quiz[u.id] = { answers:{} });
      rec.answers[qi] = val;
      saveState();
      judge(card, qi, val, u, false);
    });
  });
  function judge(card, qi, val, u, silent){
    const ans = u.quiz[qi].ans;
    card.querySelectorAll('.opts label').forEach((lb, oi) => {
      lb.classList.remove('correct', 'wrong');
      if(oi === ans) lb.classList.add('correct');
      else if(oi === val) lb.classList.add('wrong');
    });
    card.querySelector('[data-exp="' + qi + '"]').classList.add('show');
    if(!silent) refreshQuizScore(root, u);
  }
  function refreshQuizScore(root, u){
    const rec = (state.quiz[u.id] && state.quiz[u.id].answers) || {};
    const answered = Object.keys(rec).length;
    const right = Object.keys(rec).filter(k => Number(rec[k]) === u.quiz[Number(k)].ans).length;
    root.querySelector('#quizResult').textContent =
      '已作答 ' + answered + '/' + u.quiz.length + '，答对 ' + right + ' 题。答错的题目请阅读解析，可重新作答。';
  }
  refreshQuizScore(root, u);
}
function flashResult(root, msg){
  const el = root.querySelector('#quizResult');
  if(el){ el.textContent = msg; }
}

/* ---------- 7.5 实操检查单（持久化） ---------- */
function checklistHtml(key, title, items){
  const saved = (state.checklists && state.checklists[key]) || {};
  return '<div class="widget" id="ck_' + key + '"><div class="w-head"><span class="w-title">' + title + '</span>' +
    '<span class="w-note">勾选状态自动保存在本机</span>' +
    '<button class="btn" data-ckreset="' + key + '">清空勾选</button></div>' +
    items.map((it, i) =>
      '<label style="display:flex;gap:10px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer">' +
      '<input type="checkbox" data-ck="' + key + '" data-i="' + i + '"' + (saved[i] ? ' checked' : '') + '>' +
      '<span>' + it + '</span></label>').join('') + '</div>';
}
function bindChecklists(root){
  root.querySelectorAll('[data-ck]').forEach(cb => cb.addEventListener('change', () => {
    state.checklists = state.checklists || {};
    const k = cb.dataset.ck;
    state.checklists[k] = state.checklists[k] || {};
    if(cb.checked) state.checklists[k][cb.dataset.i] = 1; else delete state.checklists[k][cb.dataset.i];
    saveState();
  }));
  root.querySelectorAll('[data-ckreset]').forEach(b => b.addEventListener('click', () => {
    state.checklists[b.dataset.ckreset] = {};
    saveState();
    root.querySelectorAll('[data-ck="' + b.dataset.ckreset + '"]').forEach(x => { x.checked = false; });
  }));
}

/* ---------- 8. 页面渲染 ---------- */
function currentUnitId(){
  const m = location.hash.match(/^#\/u\/(\d{2})$/);
  return m ? m[1] : null;
}
function progressPct(){
  const n = Object.keys(state.done).filter(k => state.done[k]).length;
  return { n, pct: Math.round(n / TOTAL_UNITS * 100) };
}
function updateProgress(){
  const { n, pct } = progressPct();
  document.getElementById('progressText').textContent = n + '/' + TOTAL_UNITS;
  document.getElementById('progressBar').style.width = pct + '%';
}

function pagerHtml(u){
  const idx = UNITS.findIndex(x => x.id === u.id);
  const prev = UNITS[idx - 1], next = UNITS[idx + 1];
  return '<nav class="pager">' +
    (prev ? '<a class="prev" href="#/u/' + prev.id + '"><small>上一单元</small>' + esc(prev.title) + '</a>' : '<span style="flex:1"></span>') +
    (next ? '<a class="next" href="#/u/' + next.id + '"><small>下一单元</small>' + esc(next.title) + '</a>' : '<span style="flex:1"></span>') +
    '</nav>';
}

function unitShellHtml(u, body){
  const stage = STAGES.find(s => s.ids.includes(u.id));
  return '<article class="unit">' +
    '<header class="unit-head">' +
      '<div class="stage">' + (stage ? stage.name : '') + ' · 单元 ' + u.id + '</div>' +
      '<h1>' + esc(u.title) + '</h1>' +
      '<div class="tags">' + (u.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
      '<button class="btn markdone" id="markDoneBtn" aria-pressed="' + (state.done[u.id] ? 'true' : 'false') + '">' +
        (state.done[u.id] ? '✓ 已掌握本单元（点击取消）' : '标记本单元已掌握') + '</button>' +
    '</header>' + body + quizHtml(u) + pagerHtml(u) + '</article>';
}

function renderUnit(u){
  const root = document.getElementById('content');
  const html = unitShellHtml(u, typeof u.render === 'function' ? u.render() : wipBody(u));
  root.innerHTML = html;
  root.querySelector('#markDoneBtn').addEventListener('click', function(){
    state.done[u.id] = !state.done[u.id];
    if(!state.done[u.id]) delete state.done[u.id];
    saveState();
    this.setAttribute('aria-pressed', state.done[u.id] ? 'true' : 'false');
    this.textContent = state.done[u.id] ? '✓ 已掌握本单元（点击取消）' : '标记本单元已掌握';
    updateProgress(); renderSidebar();
  });
  bindQuiz(root, u);
  bindChecklists(root);
  if(typeof u.onMount === 'function'){ try{ u.onMount(root); }catch(e){ console.error('单元 ' + u.id + ' 交互初始化失败：', e); } }
  state.last = '#/u/' + u.id;
}

function wipBody(u){
  const stage = STAGES.find(s => s.ids.includes(u.id));
  return '<div class="co co-warn"><div class="co-t">建设中</div>' +
    '<p>本单元（' + esc(u.title) + '）内容按批次实施计划尚未编写，当前展示其知识大纲与素材绑定。' +
    '已编写的单元不会出现本提示。</p></div>' +
    '<h2>规划内容</h2><ul>' +
    (u.outline || []).map(o => '<li>' + o + '</li>').join('') + '</ul>' +
    '<h2>素材绑定</h2><ul>' +
    '<li><strong>教材：</strong>' + (u.srcBook || '—') + '</li>' +
    '<li><strong>规范依据：</strong>' + (u.srcSpec || '—') + '</li>' +
    '<li><strong>平台资料：</strong>' + (u.srcRenesas || '—') + '</li></ul>';
}

function renderOverview(){
  const root = document.getElementById('content');
  const { n } = progressPct();
  const unitCards = STAGES.map(st =>
    '<h2>' + st.name + '</h2><div class="ov-grid">' +
    st.ids.map(id => {
      const u = UNITS.find(x => x.id === id);
      if(!u) return '';
      const locked = u.wip;
      return '<a class="ov-card' + (locked ? ' locked' : '') + '" href="#/u/' + id + '">' +
        '<b>' + id + ' · ' + esc(u.title) + (state.done[id] ? ' ✓' : '') + '</b>' +
        '<small>' + esc(u.summary || (u.tags || []).join(' · ')) + '</small>' +
        (locked ? '<small><br>🚧 建设中</small>' : '') + '</a>';
    }).join('') + '</div>').join('');

  root.innerHTML =
  '<article><header class="unit-head"><h1>课程总览</h1></header>' +
  '<p>本课程以 <em>Getting Started with Bluetooth Low Energy</em>（O’Reilly, 2014，Townsend 等）为基础教材建立 BLE 知识框架，' +
  '以 Robin Heydon《Bluetooth Low Energy: The Developer’s Handbook》中译本《低功耗蓝牙开发权威指南》（机械工业出版社）为深度补充，' +
  '以 Bluetooth SIG 正式规范核对术语与版本演进，最终落到 Renesas DA14531（DEVKT-B Pro Kit + Keil MDK）的动手实战。' +
  '当前已完成 <b>' + n + '/' + TOTAL_UNITS + '</b> 个单元的掌握标记。</p>' +

  '<div class="co co-warn"><div class="co-t">关于两本教材的重要说明</div>' +
  '<p>《低功耗蓝牙开发权威指南》<strong>并非</strong> O’Reilly 教材的中译本，而是另一本独立著作（Heydon 著）。' +
  '两书章节映射在课程中分开维护；且两书均成书于 Bluetooth 4.0 时代，凡涉及 4.2 及以后的新特性（如 Extended Advertising、DLE、LE Audio），' +
  '一律以 SIG 正式规范为准并标注 <span class="tag">VERSION-DELTA</span>。</p></div>' +

  '<h2 id="legend">证据与标签图例</h2>' +
  '<table class="tbl"><caption>课程内容遵循可追溯原则，重要结论标注来源等级</caption>' +
  '<tr><th>标签</th><th>含义</th></tr>' +
  '<tr><td><span class="tag">BOOK</span></td><td>基础教材内容（章节级映射）</td></tr>' +
  '<tr><td><span class="tag">SPEC</span></td><td>Bluetooth SIG 正式规范，附可访问链接</td></tr>' +
  '<tr><td><span class="tag">RENESAS</span> <span class="tag">SDK</span></td><td>Renesas 官方文档 / 指定版本 SDK（6.0.22.1401）的实现</td></tr>' +
  '<tr><td><span class="tag">VERSION-DELTA</span></td><td>教材年代与现行规范之间的版本差异</td></tr>' +
  '<tr><td><span class="tag">TEACHING</span> <span class="tag">SIMULATED</span></td><td>教学简化 / 模拟器仿真行为，不代表真实射频测量</td></tr>' +
  '<tr><td><span class="tag">VERIFIED</span> <span class="tag">UNVERIFIED</span></td><td>有明确测试证据 / 尚未验证（真实硬件验证均从未验证起步）</td></tr></table>' +

  '<div class="co co-sim"><div class="co-t">模拟器使用边界</div>' +
  '<p>课程中的模拟器用于建立因果直觉（参数变化 → 行为变化），其时间模型与随机性假设会在各组件旁明确说明。' +
  '模拟器结果<strong>不能</strong>当作真实无线环境的预测值；DA14531 的真实功耗与吞吐需要用真实硬件测量。</p></div>' +

  '<h2>如何使用本课程</h2>' +
  '<ol>' +
  '<li>按单元顺序学习；每单元包含学习目标、术语表、正文、交互组件、自测题与来源引用。</li>' +
  '<li>右上角可全局搜索术语（如 “MTU”“广播间隔”）；左侧栏可筛选单元。</li>' +
  '<li>完成自测并理解解析后，点击单元头部的“标记本单元已掌握”，进度自动保存在本机（localStorage）。</li>' +
  '<li>浅色/深色主题可随时切换；刷新页面后学习进度与答题状态自动恢复。</li></ol>' +

  '<h2>动手实践环境（第五阶段使用）</h2>' +

  '<tr><td>SDK</td><td>DA145xx SDK 6.0.22.1401（2024-03-14 发布，协议栈 ROM 交付）</td></tr>' +

  unitCards +
  '</article>';
  state.last = '#/overview';
}

/* ---------- 9. 路由与启动 ---------- */
function route(){
  teardown();
  const id = currentUnitId();
  const u = id && UNITS.find(x => x.id === id);
  if(u && !u.wip){ renderUnit(u); }
  else if(u && u.wip){ renderUnit(u); }   // wip 单元渲染占位大纲
  else { renderOverview(); }
  renderSidebar(); updateProgress();
  window.scrollTo(0, 0);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); }

function boot(){
  applyTheme();
  document.getElementById('themeBtn').addEventListener('click', toggleTheme);
  document.getElementById('homeBtn').addEventListener('click', () => { location.hash = '#/overview'; });
  document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('unitFilter').addEventListener('input', renderSidebar);
  const si = document.getElementById('searchInput');
  si.addEventListener('input', () => doSearch(si.value));
  document.addEventListener('click', e => {
    if(!e.target.closest('.searchbox')) document.getElementById('searchResults').style.display = 'none';
  });
  window.addEventListener('hashchange', route);
  if(!location.hash) location.hash = state.last || '#/overview';
  route();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
